services:
  - type: web
    name: daily-planner-miniapp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: AUTO_SET_WEBHOOK
        value: "yes"
      - key: NODE_VERSION
        value: "22"
